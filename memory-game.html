<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate AI - Memory Match</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #17203a;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .controls {
            margin: 25px 0;
        }

        select,
        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .game-board {
            max-width: 700px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .card {
            height: 120px;
            background: #ffffff;
            color: #17203a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
        }

        .card.hidden {
            background: #4f46e5;
            color: transparent;
        }

        .stats {
            margin: 20px;
            font-size: 18px;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
            }

            .card {
                height: 90px;
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <h1>🧠 Memory Match</h1>

    <p>Find and match all the identical cards!</p>

    <div class="controls">
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
        </select>

        <button onclick="startGame()">🔄 Restart</button>
    </div>

    <div class="stats">
        Moves: <span id="moves">0</span>
        &nbsp; | &nbsp;
        Pairs: <span id="pairs">0</span>
    </div>

    <div id="gameBoard" class="game-board"></div>

    <div id="message"></div>

    <script>
        const emojis = [
            "🍎", "🍌", "🍇", "🍉",
            "🍓", "🍊", "🥝", "🍍"
        ];

        let cards = [];
        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;
        let moves = 0;
        let pairs = 0;

        function startGame() {
            const difficulty = document.getElementById("difficulty").value;

            let pairCount = 4;

            if (difficulty === "medium") {
                pairCount = 6;
            }

            if (difficulty === "hard") {
                pairCount = 8;
            }

            cards = [...emojis.slice(0, pairCount), ...emojis.slice(0, pairCount)];

            cards.sort(() => Math.random() - 0.5);

            firstCard = null;
            secondCard = null;
            lockBoard = false;
            moves = 0;
            pairs = 0;

            document.getElementById("moves").textContent = moves;
            document.getElementById("pairs").textContent = pairs;
            document.getElementById("message").textContent = "";

            const board = document.getElementById("gameBoard");
            board.innerHTML = "";

            cards.forEach((emoji, index) => {
                const card = document.createElement("div");

                card.className = "card hidden";
                card.dataset.value = emoji;
                card.textContent = emoji;

                card.onclick = function () {
                    flipCard(card);
                };

                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (!card.classList.contains("hidden")) return;
            if (card === firstCard) return;

            card.classList.remove("hidden");

            if (!firstCard) {
                firstCard = card;
                return;
            }

            secondCard = card;
            moves++;

            document.getElementById("moves").textContent = moves;

            checkMatch();
        }

        function checkMatch() {
            if (firstCard.dataset.value === secondCard.dataset.value) {
                pairs++;

                document.getElementById("pairs").textContent = pairs;

                firstCard = null;
                secondCard = null;

                if (pairs === cards.length / 2) {
                    document.getElementById("message").textContent =
                        "🎉 Congratulations! You matched all cards!";
                }

            } else {
                lockBoard = true;

                setTimeout(() => {
                    firstCard.classList.add("hidden");
                    secondCard.classList.add("hidden");

                    firstCard = null;
                    secondCard = null;
                    lockBoard = false;
                }, 800);
            }
        }

        startGame();
    </script>

</body>
</html>
