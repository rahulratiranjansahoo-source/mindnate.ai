<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Reaction - MindMate AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: #243b55;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: #f1f4f8;
            padding: 12px 20px;
            border-radius: 12px;
            min-width: 120px;
        }

        .stat strong {
            display: block;
            font-size: 22px;
            color: #243b55;
        }

        #reactionBox {
            width: 100%;
            height: 300px;
            border-radius: 20px;
            background: #d9dde2;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0;
            cursor: pointer;
            user-select: none;
            transition: 0.15s;
        }

        #reactionText {
            font-size: 28px;
            font-weight: bold;
            color: #243b55;
            padding: 20px;
        }

        #reactionBox.ready {
            background: #42d66b;
        }

        .start {
            border: none;
            background: #243b55;
            color: white;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
        }

        .start:hover {
            opacity: 0.9;
        }

        .message {
            min-height: 30px;
            font-weight: bold;
            color: #243b55;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #243b55;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            #reactionBox {
                height: 240px;
            }

            #reactionText {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>⚡ Quick Reaction</h1>

    <p class="subtitle">
        Click as quickly as possible when the screen changes!
    </p>

    <div class="stats">

        <div class="stat">
            <strong id="round">0</strong>
            Round
        </div>

        <div class="stat">
            <strong id="best">--</strong>
            Best (ms)
        </div>

    </div>

    <div class="message" id="message">
        Press Start Game to begin!
    </div>

    <div id="reactionBox" onclick="reactionClick()">

        <div id="reactionText">
            Ready?
        </div>

    </div>

    <button class="start" onclick="startGame()">
        🚀 Start Game
    </button>

    <br>

    <a class="back" href="index.html">
        ← Back to MindMate
    </a>

</div>

<script>

    const reactionBox = document.getElementById("reactionBox");
    const reactionText = document.getElementById("reactionText");
    const message = document.getElementById("message");
    const roundDisplay = document.getElementById("round");
    const bestDisplay = document.getElementById("best");

    let waiting = false;
    let ready = false;
    let startTime = 0;
    let round = 0;
    let bestTime = null;
    let timer = null;

    function startGame() {

        clearTimeout(timer);

        round = 0;
        bestTime = null;

        roundDisplay.textContent = "0";
        bestDisplay.textContent = "--";

        nextRound();
    }

    function nextRound() {

        round++;

        roundDisplay.textContent = round;

        waiting = true;
        ready = false;

        reactionBox.classList.remove("ready");

        reactionText.textContent = "Wait for it...";
        message.textContent = "👀 Don't click yet!";

        const randomDelay =
            Math.floor(Math.random() * 3000) + 2000;

        timer = setTimeout(() => {

            ready = true;
            waiting = false;

            reactionBox.classList.add("ready");

            reactionText.textContent = "CLICK NOW! ⚡";
            message.textContent = "🔥 GO!";

            startTime = performance.now();

        }, randomDelay);
    }

    function reactionClick() {

        if (waiting) {

            clearTimeout(timer);

            waiting = false;

            reactionText.textContent = "Too early! ❌";
            message.textContent =
                "You clicked too early. Try again.";

            setTimeout(nextRound, 1500);

            return;
        }

        if (!ready) {
            return;
        }

        const reactionTime =
            Math.round(performance.now() - startTime);

        ready = false;

        reactionBox.classList.remove("ready");

        reactionText.textContent =
            reactionTime + " ms";

        message.textContent =
            "⚡ Great reaction!";

        if (bestTime === null || reactionTime < bestTime) {

            bestTime = reactionTime;

            bestDisplay.textContent = bestTime;

        }

        setTimeout(nextRound, 1500);
    }

</script>

</body>
</html>
